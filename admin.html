<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>YMSDI Pay Admin</title><meta name="robots" content="noindex,nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--g:#065f33;--gd:#0a2418;--bg:#eef2ee;--card:#fff;--ink:#10231a;--mute:#5b6b62;--line:#dfe6e0;--err:#b3261e;--blue:#1d4ed8;--amber:#b45309}
@media (prefers-color-scheme:dark){:root{--bg:#0b130e;--card:#15221a;--ink:#e8f1ea;--mute:#9bb0a2;--line:#27382d}}
*{box-sizing:border-box}body{margin:0;font-family:Roboto,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
header{background:var(--gd);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header b{font-size:1.05rem}header small{opacity:.8;margin-right:8px;font-size:.8rem}
header button{background:transparent;border:1px solid #fff;color:#fff;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
main{max-width:1000px;margin:0 auto;padding:14px 14px 110px}
.card,section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.mode{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.badge{display:inline-block;padding:4px 12px;border-radius:99px;color:#fff;font-weight:700;font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}.stat small{color:var(--mute);display:block}.stat b{font-size:1.25rem}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:720px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 10px;text-align:center;cursor:pointer;font:inherit;color:var(--ink);min-height:96px}
.tile:hover{border-color:var(--g)}.tile .ic{font-size:1.7rem;display:block}.tile .n{position:absolute;top:8px;right:8px;background:var(--err);color:#fff;border-radius:99px;padding:1px 8px;font-size:.78rem;font-weight:700}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:10px}.bar h2{margin:0;font-size:1.2rem}.bar button{padding:8px 12px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row b{display:block}.row small{color:var(--mute);display:block;margin-bottom:6px}
.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.line>div{flex:1;min-width:120px}
input,select{flex:1;min-width:130px;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink);width:100%}
button.b,.bar button,#li{padding:10px 14px;border:0;border-radius:10px;background:var(--g);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button.b.red{background:var(--err)}button.b.grey,.bar button{background:var(--mute)}
details.grp{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:0 12px}details.grp summary{cursor:pointer;padding:12px 0;font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #4aa36f;outline-offset:2px}
#toast{position:fixed;left:12px;right:12px;bottom:84px;max-width:560px;margin:auto;padding:12px;border-radius:10px;background:var(--gd);color:#fff;display:none;z-index:9}#toast.err{background:var(--err)}
.gate{max-width:380px;margin:40px auto}.gate input{margin-bottom:10px}
</style></head><body>
<header><b>YMSDI Pay Admin</b><div><small id="who"></small><button id="out" hidden>Sign out</button></div></header>
<main>
<section id="gate" class="gate" hidden><h2 style="margin-top:0">Admin sign in</h2><input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button id="li" style="width:100%">Sign in</button><p id="gmsg" style="color:var(--err)"></p></section>
<div id="app" hidden>
  <div id="home"><div class="card" id="modecard"></div><div class="stats" id="stats"></div><div class="tiles" id="tiles"></div></div>
  <div id="sec" hidden><div class="bar"><button id="back">&larr; Dashboard</button><h2 id="sectitle"></h2></div><section id="view"></section></div>
</div></main><div id="toast" role="status"></div>
<script>
const SUPABASE_URL = "https://svzyycobhthrnrljxghp.supabase.co", SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2enl5Y29iaHRocm5ybGp4Z2hwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4ODAxMzgsImV4cCI6MjEwNzQ1NjEzOH0.5WoKPsE62OqXkg71cIvXoVnr3CGtDeMNtMS2eq0brmU";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id), fmt = n => Number(n).toLocaleString("en-US", {maximumFractionDigits: 2});
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
function el(tag, text, cls){ const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; }
function toast(t, err){ const x = $("toast"); x.textContent = t; x.className = err ? "err" : ""; x.style.display = "block"; setTimeout(() => x.style.display = "none", 5000); }
async function run(p, ok){ const { error } = await p; if (error){ toast(error.message, true); return false; } toast(ok || "Saved"); return true; }
function btn(text, fn, cls){ const b = el("button", text, "b " + (cls || "")); b.onclick = fn; return b; }
function row(title, help){ const r = el("div", null, "row"); r.appendChild(el("b", title)); if (help) r.appendChild(el("small", help)); return r; }
function view(){ const v = $("view"); v.textContent = ""; return v; }
async function fn(name, method){ const { data: { session } } = await db.auth.getSession(); const res = await fetch(SUPABASE_URL + "/functions/v1/" + name, { method: method || "POST", headers: { Authorization: "Bearer " + session.access_token } }); const j = await res.json().catch(() => ({})); if (!res.ok) throw new Error(j.error || "Request failed"); return j; }

async function features(){
  const v = view();
  const { data: rt } = await db.from("rates").select("ugx_per_usdt").eq("pair","USDT_UGX").single();
  const rr = row("USDT to UGX rate", "Used for every quote. Update it often, or ask your partner for a live feed."); const rl = el("div", null, "line");
  const ri = el("input"); ri.type = "number"; ri.value = rt ? rt.ugx_per_usdt : 3650;
  rl.append(ri, btn("Save rate", () => run(db.rpc("admin_set_rate", {p_rate: Number(ri.value)})))); rr.appendChild(rl); v.appendChild(rr);
  const { data } = await db.from("feature_flags").select("*").order("phase").order("label");
  (data || []).forEach(f => {
    const r = row(f.label, "Phase " + f.phase); const line = el("div", null, "line");
    const sel = el("select"); sel.add(new Option("On", "true")); sel.add(new Option("Off", "false")); sel.value = String(f.enabled);
    line.append(sel, btn("Save", () => run(db.rpc("admin_set_flag", {p_key: f.key, p_enabled: sel.value === "true"})))); r.appendChild(line); v.appendChild(r);
  });
}

async function cashouts(){
  const v = view();
  const bar = el("div", null, "line");
  bar.appendChild(btn("Send approved payouts now", async () => {
    const { data: { session } } = await db.auth.getSession();
    const res = await fetch(SUPABASE_URL + "/functions/v1/pay-api/payouts", { method: "POST", headers: { Authorization: "Bearer " + session.access_token } });
    const j = await res.json(); if (!res.ok){ toast(j.error || "Failed", true); return; }
    toast(`Sent ${j.sent}. ` + (j.errors && j.errors.length ? j.errors.join(" | ") : "No errors.")); cashouts();
  }));
  v.appendChild(bar);
  const { data } = await db.from("cashouts").select("*").in("status", ["pending_review","approved","sending","sent","failed"]).order("id", {ascending: false}).limit(50);
  if (!data || !data.length) v.appendChild(el("p", "No cash outs waiting."));
  (data || []).forEach(c => {
    const r = row(`CO-${c.id}: UGX ${fmt(c.ugx_amount)} to ${c.network.toUpperCase()} ${c.msisdn}`, `${c.status}${c.note ? " | " + c.note : ""} | ${new Date(c.created_at).toLocaleString()}`);
    if (c.status === "pending_review"){
      const line = el("div", null, "line");
      line.append(btn("Approve", async () => { if (await run(db.rpc("admin_review_cashout", {p_id: c.id, p_approve: true, p_note: null}))) cashouts(); }),
                  btn("Reject and refund", async () => { const n = prompt("Reason (shown to the user):") || "Rejected"; if (await run(db.rpc("admin_review_cashout", {p_id: c.id, p_approve: false, p_note: n}))) cashouts(); }, "red"));
      r.appendChild(line);
    }
    if (c.status === "sending") r.appendChild(el("small", "If this stays on 'sending', check the partner dashboard before doing anything. Never send it twice."));
    v.appendChild(r);
  });
}

async function kyc(){
  const v = view();
  const { data } = await db.from("kyc").select("*").eq("status", "pending").order("submitted_at");
  if (!data || !data.length) v.appendChild(el("p", "No ID checks waiting."));
  (data || []).forEach(k => {
    const r = row(k.full_name + " | ID " + k.id_number, new Date(k.submitted_at).toLocaleString()); const line = el("div", null, "line");
    line.append(btn("View document", async () => { const { data: u, error } = await db.storage.from("kyc").createSignedUrl(k.doc_path, 120); if (error) toast(error.message, true); else window.open(u.signedUrl, "_blank", "noopener"); }, "grey"),
      btn("Approve", async () => { if (await run(db.rpc("admin_review_kyc", {p_user: k.user_id, p_approve: true, p_note: null}))) kyc(); }),
      btn("Reject", async () => { const n = prompt("Reason:") || "Rejected"; if (await run(db.rpc("admin_review_kyc", {p_user: k.user_id, p_approve: false, p_note: n}))) kyc(); }, "red"));
    r.appendChild(line); v.appendChild(r);
  });
}

async function walletpays(){
  const v = view();
  v.appendChild(el("p", "Wallet payments that need a decision. Refunds are sent by you from your wallet or partner dashboard (crypto payments cannot be reversed automatically). Then press Mark refunded."));
  const { data } = await db.from("orders").select("*").in("status", ["needs_review","refund_due"]).eq("pay_method","wallet").order("id", {ascending:false});
  if (!data || !data.length) v.appendChild(el("p", "Nothing needs attention."));
  for (const o of (data || [])){
    const { data: wp } = await db.from("wallet_payments").select("*").eq("order_id", o.id);
    const r = row(`ORD-${o.id}: UGX ${fmt(o.ugx_amount)} | expected ${o.pay_total} USDT on ${o.chain}`, o.status.replace("_", " "));
    (wp || []).forEach(p => r.appendChild(el("small", `Received ${p.amount_usdt} USDT from ${p.payer} | tx ${p.tx_hash} | ${p.note || ""}`)));
    const line = el("div", null, "line");
    if (o.status === "needs_review") line.appendChild(btn("Approve and process", async () => { if (await run(db.rpc("admin_resolve_wallet_order", {p_order: o.id, p_action: "approve", p_note: "Approved by admin"}))) walletpays(); }));
    line.appendChild(btn("Mark refunded", async () => { const n = prompt("Refund transaction hash or note:") || ""; if (await run(db.rpc("admin_resolve_wallet_order", {p_order: o.id, p_action: "refunded", p_note: n}))) walletpays(); }, "red"));
    r.appendChild(line); v.appendChild(r);
  }
}

async function feesTab(){
  const v = view();
  v.appendChild(el("p", "Set what customers pay (percent, minimum, flat) and what YOUR partner charges you (cost estimates, used for profit reports). The customer fee is: the larger of (percent of amount + flat) and the minimum. Rates change with each partner, so edit these when you sign agreements. Changes apply to new transactions only."));
  const { data: sp } = await db.from("app_settings").select("value").eq("key","spread_percent").single();
  const sr = row("Exchange spread (%)", "Customers get the base USDT rate minus this %. The difference is your margin. Keep 0 if your partner already adds a margin, and always show customers the rate."); const sl = el("div", null, "line");
  const si = el("input"); si.type = "number"; si.step = "0.1"; si.value = sp ? sp.value : "0";
  sl.append(si, btn("Save", () => run(db.rpc("admin_set_setting", {p_key: "spread_percent", p_value: String(num(si.value))})))); sr.appendChild(sl); v.appendChild(sr);

  const pr = row("Preview a payment of (UGX)"); const pi = el("input"); pi.type = "number"; pi.value = 20000; pr.appendChild(pi); const pout = el("small", ""); pr.appendChild(pout); v.appendChild(pr);
  const { data } = await db.from("fee_rules").select("*").order("key");
  const rules = (data || []).map(r => ({ r, inputs: {} }));
  const field = (r, box, key, label, step) => { const w = el("div"); w.appendChild(el("small", label)); const i = el("input"); i.type = "number"; i.step = step || "any"; i.min = "0"; i.value = r[key]; box.inputs[key] = i; i.oninput = preview; w.appendChild(i); return w; };
  function preview(){
    const a = num(pi.value); pout.textContent = rules.filter(x => x.inputs.percent).map(x => {
      const fee = Math.max(Math.round(a * num(x.inputs.percent.value) / 100 + num(x.inputs.flat_ugx.value)), num(x.inputs.min_ugx.value));
      const cost = Math.round(a * num(x.inputs.partner_percent.value) / 100 + num(x.inputs.partner_flat_ugx.value));
      return `${x.r.label}: fee UGX ${fmt(fee)}, est. cost UGX ${fmt(cost)}, est. profit UGX ${fmt(fee - cost)}`; }).join("  |  ");
  }
  rules.forEach(x => {
    const r = x.r, rw = row(r.label + (r.key === "*" || r.key === "cashout" ? "" : " (" + r.key + ")"));
    const g = el("div", null, "line");
    g.append(field(r, x, "percent", "Customer fee %", "0.1"), field(r, x, "min_ugx", "Minimum fee (UGX)"), field(r, x, "flat_ugx", "Flat fee (UGX)"));
    const g2 = el("div", null, "line");
    g2.append(field(r, x, "partner_percent", "Your partner cost %", "0.1"), field(r, x, "partner_flat_ugx", "Your partner flat cost (UGX)"));
    const act = el("select"); act.add(new Option("Active", "true")); act.add(new Option("Off", "false")); act.value = String(r.active);
    g2.append(act, btn("Save", async () => { const i = x.inputs; await run(db.rpc("admin_save_fee_rule", { p_key: r.key, p_label: r.label, p_percent: num(i.percent.value), p_min: num(i.min_ugx.value), p_flat: num(i.flat_ugx.value), p_pp: num(i.partner_percent.value), p_pf: num(i.partner_flat_ugx.value), p_active: act.value === "true" })); }));
    rw.append(g, g2); v.appendChild(rw);
  });
  const { data: fl } = await db.from("feature_flags").select("key,label").order("label");
  const add = row("Add a rule for another category", "For example a different fee for a specific biller or for vehicles later."); const al = el("div", null, "line");
  const sel = el("select"); (fl || []).forEach(f => sel.add(new Option(f.label + " (" + f.key + ")", f.key)));
  al.append(sel, btn("Create rule", async () => { if (await run(db.rpc("admin_save_fee_rule", { p_key: sel.value, p_label: sel.options[sel.selectedIndex].text, p_percent: 1, p_min: 500, p_flat: 0, p_pp: 0, p_pf: 0, p_active: true }))) feesTab(); }));
  add.appendChild(al); v.appendChild(add); pi.oninput = preview; preview();
}

async function revenueTab(){
  const v = view(); const line = el("div", null, "line");
  const sel = el("select"); [["1","Today"],["7","Last 7 days"],["30","Last 30 days"],["3650","All time"]].forEach(([d, t]) => sel.add(new Option(t, d))); sel.value = "30";
  line.append(sel, btn("Show", load)); v.appendChild(line);
  const out = el("div"); v.appendChild(out);
  async function load(){
    const from = new Date(); from.setHours(0,0,0,0); from.setDate(from.getDate() - (Number(sel.value) - 1));
    const { data, error } = await db.from("revenue_ledger").select("*").gte("created_at", from.toISOString()).order("created_at", {ascending: false}).limit(5000);
    out.textContent = ""; if (error){ toast(error.message, true); return; }
    if (!data.length){ out.appendChild(el("p", "No completed live transactions in this period yet.")); return; }
    const tot = a => data.reduce((s, r) => s + Number(r[a]), 0);
    const sum = row("Totals (UGX)", `${data.length} completed transactions, UGX ${fmt(tot("ugx_amount"))} processed`);
    sum.appendChild(el("div", `Fees ${fmt(tot("fee_ugx"))}  +  Spread ${fmt(tot("spread_ugx"))}  -  Partner costs ${fmt(tot("partner_cost_ugx"))}  =  Net ${fmt(tot("net_ugx"))}`));
    out.appendChild(sum);
    const by = {}; data.forEach(r => { const k = r.category || "other"; (by[k] = by[k] || {n:0, fee:0, spread:0, cost:0, net:0}); const b = by[k]; b.n++; b.fee += Number(r.fee_ugx); b.spread += Number(r.spread_ugx); b.cost += Number(r.partner_cost_ugx); b.net += Number(r.net_ugx); });
    Object.entries(by).sort((a, b) => b[1].net - a[1].net).forEach(([k, b]) => out.appendChild(row(k + " (" + b.n + ")", `Fees ${fmt(b.fee)} | Spread ${fmt(b.spread)} | Costs ${fmt(b.cost)} | Net ${fmt(b.net)}`)));
    out.appendChild(btn("Download CSV for your accountant", () => {
      const cols = ["created_at","source","ref_id","category","chain","ugx_amount","fee_ugx","spread_ugx","partner_cost_ugx","net_ugx"];
      const csv = [cols.join(",")].concat(data.map(r => cols.map(c => JSON.stringify(r[c] == null ? "" : r[c])).join(","))).join("\n");
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv"})); a.download = "ymsdi-revenue.csv"; a.click();
    }, "grey"));
  }
  load();
}

async function shopsTab(){
  const v = view(); const { data } = await db.from("merchants").select("*").order("id", {ascending: false});
  v.appendChild(el("p", "Check each shop is real (visit, call, or see their business papers) before approving. Approved shops get a verified badge and can receive payments. Also switch on 'Merchant payments' in the Features tab."));
  if (!data || !data.length){ v.appendChild(el("p", "No shops registered yet.")); return; }
  data.forEach(m => {
    const r = row(`${m.name} (${m.code})`, `${m.status} | ${m.category || "-"} | ${m.district || "-"} | pays out to ${m.payout_network.toUpperCase()} ${m.payout_msisdn}`); const line = el("div", null, "line");
    const act = (label, a, cls) => btn(label, async () => { if (await run(db.rpc("admin_review_merchant", {p_id: m.id, p_action: a}))) shopsTab(); }, cls);
    if (m.status !== "approved") line.appendChild(act("Approve", "approve"));
    if (m.status === "pending") line.appendChild(act("Reject", "reject", "red"));
    if (m.status === "approved") line.appendChild(act("Suspend", "suspend", "red"));
    r.appendChild(line); v.appendChild(r);
  });
}


const MODEHELP = "demo = fictional balances, safe for anyone. pilot = private testing: only you and approved testers pay with REAL crypto from their own wallets, and you pay out by hand from your own MTN or Airtel number (no partner needed). live = public, with a licensed partner.";
async function settings(){
  const v = view(); const { data } = await db.from("app_settings").select("*").order("key");
  const groups = [["Mode and safety", k => ["payments_mode","live_signoff","maintenance","kyc_required"].includes(k)], ["Limits and protection", k => /max_|_limit|min_cashout|new_user|tx_per/.test(k)],
    ["Support and company", k => /^(support_|company|partner_name)/.test(k)], ["Wallet receiving addresses", k => k.startsWith("addr_")],
    ["Wallet tokens and networks", k => /^(usdt_|dec_|chainid_|client_rpc|deposit_network)/.test(k)], ["Server connections", k => /^(rpc_|confirm_|wallet_order)/.test(k)], ["Other", () => true]];
  const used = new Set();
  groups.forEach(([title, test]) => {
    const items = (data || []).filter(s => !used.has(s.key) && test(s.key)); if (!items.length) return; items.forEach(s => used.add(s.key));
    const d = el("details", null, "grp"); d.appendChild(el("summary", title + " (" + items.length + ")")); if (title === "Mode and safety") d.open = true;
    items.forEach(s => {
      const r = row(s.label || s.key, s.help); if (s.key === "payments_mode") r.appendChild(el("small", MODEHELP));
      const line = el("div", null, "line"); let inp;
      if (s.key === "payments_mode" || ["true","false"].includes(s.value)){ inp = el("select"); (s.key === "payments_mode" ? ["demo","pilot","live"] : ["true","false"]).forEach(o => inp.add(new Option(o, o))); inp.value = s.value; }
      else { inp = el("input"); inp.value = s.value; }
      line.append(inp, btn("Save", async () => { if (await run(db.rpc("admin_set_setting", {p_key: s.key, p_value: inp.value}))) loadHome(); })); r.appendChild(line); d.appendChild(r);
    });
    v.appendChild(d);
  });
}

    line.append(i, btn("Save", async () => { if (i.value && await run(db.rpc("admin_set_secret", {p_key: s.key, p_value: i.value}))) partner(); })); r.appendChild(line); v.appendChild(r);
  });
}
async function fulfil(){
  const v = view();
  v.appendChild(el("p", "Orders paid from a crypto wallet and waiting for you to pay out. Send the money from your own MTN or Airtel number (or buy the airtime or token yourself), then tap Mark paid and enter the mobile money transaction ID. In pilot mode this is how every payout is done."));
  const { data, error } = await db.from("orders").select("*, billers(name), merchants(name,payout_network,payout_msisdn)").eq("status", "queued").order("id");
  if (error){ toast(error.message, true); return; }
  if (!data.length) v.appendChild(el("p", "Nothing waiting. Paid orders appear here."));
  data.forEach(o => {
    const what = o.merchant_id && o.merchants ? `Pay shop "${o.merchants.name}": ${o.merchants.payout_network.toUpperCase()} ${o.merchants.payout_msisdn}`
      : o.category === "cashout" ? `Send mobile money to ${o.account_ref}` : `${(o.billers && o.billers.name) || o.category} for ${o.account_ref}`;
    const r = row(`ORD-${o.id}: send UGX ${fmt(o.ugx_amount)}`, `${what} | customer paid ${o.pay_total || o.usdt_amount} USDT${o.chain ? " on " + o.chain : ""} | ${o.mode} | ${new Date(o.created_at).toLocaleString()}`);
    const line = el("div", null, "line");
    line.append(btn("Mark paid", async () => { const ref = prompt("Mobile money transaction ID or note:"); if (ref === null) return; if (await run(db.rpc("admin_settle_manual", {p_order: o.id, p_ok: true, p_ref: ref || "manual"}))) fulfil(); }),
      btn("Could not pay", async () => { const why = prompt("Reason:"); if (why === null) return; if (await run(db.rpc("admin_settle_manual", {p_order: o.id, p_ok: false, p_ref: why || "failed"}))) fulfil(); }, "red"));
    r.appendChild(line); v.appendChild(r);
  });
}
async function testers(){
  const v = view();
  v.appendChild(el("p", "In pilot mode only you and the testers below can pay. A tester must already have signed up on the Pay page."));
  const add = row("Add a tester by email"); const line = el("div", null, "line"); const i = el("input"); i.type = "email"; i.placeholder = "tester@example.com";
  line.append(i, btn("Add", async () => { if (await run(db.rpc("admin_add_tester", {p_email: i.value}), "Tester added")) testers(); })); add.appendChild(line); v.appendChild(add);
  const { data } = await db.rpc("admin_list_testers");
  (data || []).forEach(t => { const r = row(t.email); r.appendChild(btn("Remove", async () => { if (await run(db.rpc("admin_remove_tester", {p_user: t.user_id}), "Removed")) testers(); }, "red")); v.appendChild(r); });
}
async function notifs(){
  const v = view(); const c = {};
  for (const st of ["pending","sent","failed"]){ const { count } = await db.from("notifications").select("*", {count: "exact", head: true}).eq("status", st); c[st] = count || 0; }
  v.appendChild(el("p", `SMS receipts: ${c.pending} waiting | ${c.sent} sent | ${c.failed} failed. Set the SMS keys under Keys, and deploy the send-notifications function first.`));
  v.appendChild(btn("Send waiting SMS now", async () => { try { const j = await fn("send-notifications"); toast(`Sent ${j.sent}. ` + (j.errors && j.errors.length ? j.errors.join(" | ") : "No errors.")); notifs(); } catch (e){ toast(e.message, true); } }));
  const { data } = await db.from("notifications").select("*").eq("status", "failed").order("id", {ascending: false}).limit(10);
  (data || []).forEach(n => v.appendChild(row(n.to_phone, (n.error || "failed") + " | " + n.message)));
}

const SECTIONS = {
  fulfil: ["Fulfil orders", "📤", fulfil], cashouts: ["Cash outs", "💸", cashouts], kyc: ["ID checks", "🪪", kyc], shops: ["Shops", "🏪", shopsTab], wallet: ["Wallet reviews", "👛", walletpays],
  fees: ["Fees", "🏷️", feesTab], revenue: ["Revenue", "📈", revenueTab], features: ["Features and rate", "🎛️", features], settings: ["Settings", "⚙️", settings],
  partner: ["Keys", "🔑", partner], testers: ["Testers", "🧪", testers], notifs: ["SMS receipts", "💬", notifs] };
function go(k){ $("home").hidden = true; $("sec").hidden = false; $("sectitle").textContent = SECTIONS[k][0]; SECTIONS[k][2](); window.scrollTo(0, 0); }
$("back").onclick = () => { $("sec").hidden = true; $("home").hidden = false; loadHome(); };
async function cnt(t, col, vals){ const { count } = await db.from(t).select("*", {count: "exact", head: true}).in(col, vals); return count || 0; }
async function loadHome(){
  const { data: ms } = await db.from("app_settings").select("value").eq("key", "payments_mode").single(); const mode = (ms && ms.value) || "demo";
  const col = { demo: "var(--amber)", pilot: "var(--blue)", live: "var(--g)" }[mode], txt = { demo: "Demo: fictional balances only.", pilot: "Pilot: private testing with real crypto and manual payouts.", live: "Live: public payments through your partner." }[mode];
  const mc = $("modecard"); mc.textContent = ""; const l = el("div", null, "mode"); const left = el("div"); const b = el("span", mode.toUpperCase(), "badge"); b.style.background = col; left.append(b, el("span", "  " + txt)); l.append(left, btn("Change mode", () => go("settings"), "grey")); mc.appendChild(l);
  const since = new Date(); since.setHours(0, 0, 0, 0);
  const { data: rv } = await db.from("revenue_ledger").select("ugx_amount,net_ugx").gte("created_at", since.toISOString());
  const st = $("stats"); st.textContent = "";
  [["Paid out today", (rv || []).length + " transactions"], ["Volume today", "UGX " + fmt((rv || []).reduce((a, r) => a + Number(r.ugx_amount), 0))], ["Net profit today", "UGX " + fmt((rv || []).reduce((a, r) => a + Number(r.net_ugx), 0))]]
    .forEach(([a, b2]) => { const d = el("div", null, "stat"); d.append(el("small", a), el("b", b2)); st.appendChild(d); });
  const counts = { fulfil: await cnt("orders", "status", ["queued"]), cashouts: await cnt("cashouts", "status", ["pending_review"]), kyc: await cnt("kyc", "status", ["pending"]), shops: await cnt("merchants", "status", ["pending"]),
    wallet: await cnt("orders", "status", ["needs_review", "refund_due"]), notifs: await cnt("notifications", "status", ["pending"]) };
  const t = $("tiles"); t.textContent = "";
  Object.entries(SECTIONS).forEach(([k, [label, ic]]) => { const b3 = el("button", null, "tile"); b3.append(el("span", ic, "ic"), el("span", label)); if (counts[k]) b3.appendChild(el("span", String(counts[k]), "n")); b3.onclick = () => go(k); t.appendChild(b3); });
}
async function boot(){
  const { data: { session } } = await db.auth.getSession();
  if (!session){ $("gate").hidden = false; $("app").hidden = true; return; }
  const { data: ok, error } = await db.rpc("is_admin"); $("gate").hidden = true;
  if (error || !ok){ $("app").hidden = true; $("gate").hidden = false; $("gmsg").textContent = (error ? error.message : "Signed in as " + session.user.email + ", but this account is not an admin.") ; $("out").hidden = false; return; }
  $("who").textContent = session.user.email; $("out").hidden = false; $("app").hidden = false; loadHome();
}
$("li").onclick = async () => { const { error } = await db.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value }); if (error){ $("gmsg").textContent = error.message; return; } location.reload(); };
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") $("li").click(); });
$("out").onclick = async () => { await db.auth.signOut(); location.reload(); };
boot();
</script></body></html>
